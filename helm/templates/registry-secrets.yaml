{{- /*
Vault-backed image pull secrets (task 4.1, openspec change gitlab-token-rotation).
Renders one ClusterSecretStore + one ExternalSecret per entry in
.Values.registryPullSecrets.secrets. Each target secret is a
kubernetes.io/dockerconfigjson built by ESO at sync time from the token
stored in Vault KV (value=<token>); host/user come from Helm values.
Note: the ESO template body must reach the cluster literally, so its
opening braces are injected via printf (Helm would otherwise evaluate them).
*/ -}}
{{- with .Values.registryPullSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .storeName }}
spec:
  provider:
    vault:
      server: {{ .vault.server }}
      path: gitlab
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .vault.role }}
          serviceAccountRef:
            name: {{ .vault.serviceAccountName }}
            namespace: {{ .vault.serviceAccountNamespace }}
{{- range .secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.registryPullSecrets.storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: {{ printf "%s printf %q .password %s" "{{" (printf "{\"auths\":{%q:{\"username\":%q,\"password\":\"%%s\"}}}" $.Values.registryPullSecrets.registryHost $.Values.registryPullSecrets.registryUser) "}}" | quote }}
  data:
    - secretKey: password # pragma: allowlist secret
      remoteRef:
        key: {{ $.Values.registryPullSecrets.kvPath }}
        property: value
{{- end }}
{{- end }}
