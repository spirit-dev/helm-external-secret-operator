{{- /*
Vault-backed plain (non-registry) secrets (see values.yaml `secretSyncs`).
One ExternalSecret per entry, fetched via the shared ClusterSecretStore.
Two forms per entry:
  - single-key (legacy): `secretKey` + `template` render one KV property
    (default `value`, what `vault-put.sh` in gitlab-token-updater writes).
  - multi-key: `keys` list syncs several KV fields of the same KV record into
    distinct secret keys (each template defaults to a plain copy of the
    provider value; ESO exposes provider values by secretKey in the body).
The template's `{{` braces reach the cluster literally (Helm inserts values
single-pass; ESO evaluates them at sync time).
*/ -}}
{{- with .Values.secretSyncs }}
{{- range .secrets }}
{{- $kvPath := .kvPath }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretSyncs.storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range .keys }}
        {{ .key }}: {{ .template | default (printf "{{ .%s }}" .key) | quote }}
        {{- end }}
        {{- if not .keys }}
        {{ .secretKey }}: {{ .template | quote }}
        {{- end }}
  data:
    {{- range .keys }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ $kvPath }}
        property: {{ .property | default "value" }}
    {{- end }}
    {{- if not .keys }}
    - secretKey: value # pragma: allowlist secret
      remoteRef:
        key: {{ .kvPath }}
        property: {{ .property | default "value" }}
    {{- end }}
{{- end }}
{{- end }}
