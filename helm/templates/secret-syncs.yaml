{{- /*
Vault-backed plain (non-registry) secrets (see values.yaml `secretSyncs`).
One ExternalSecret per entry: fetches the KV property `value` via the shared
ClusterSecretStore and renders the target key through the entry's ESO template
body from values. The body's `{{` braces reach the cluster literally (Helm
inserts values single-pass; ESO evaluates them at sync time).
*/ -}}
{{- with .Values.secretSyncs }}
{{- range .secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretSyncs.storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .secretKey }}: {{ .template | quote }}
  data:
    - secretKey: value # pragma: allowlist secret
      remoteRef:
        key: {{ .kvPath }}
        property: value
{{- end }}
{{- end }}
